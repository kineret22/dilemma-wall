<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>קיר הדילמות — תצוגה ציבורית</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:#0b0b14; --surface:#13131f; --card:#1a1a2e; --card2:#1f1f38;
      --border:rgba(255,255,255,0.08); --gold:#f0c040; --glow:rgba(240,192,64,0.15);
      --accent:#7c6af7; --text:#f0eeea; --muted:#8888aa;
    }
    body { font-family:'Heebo',sans-serif; background:var(--bg); color:var(--text); min-height:100dvh; display:grid; grid-template-rows:auto auto auto 1fr; overflow:hidden; direction:rtl; }
    .header { background:var(--surface); border-bottom:1px solid var(--border); padding:18px 40px; display:flex; align-items:center; justify-content:space-between; }
    .header-title { font-size:20px; font-weight:900; background:linear-gradient(135deg,#fff 30%,var(--gold) 100%); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
    .live-badge { display:flex; align-items:center; gap:8px; background:rgba(80,200,80,0.12); border:1px solid rgba(80,200,80,0.3); color:#6de06d; font-size:13px; font-weight:600; padding:6px 16px; border-radius:20px; }
    .live-dot { width:8px; height:8px; background:#6de06d; border-radius:50%; animation:pulse 1.4s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
    .count-badge { font-size:14px; color:var(--muted); }
    .count-badge span { color:var(--gold); font-weight:700; font-size:18px; }
    .question-bar { background:var(--card); border-bottom:1px solid var(--border); padding:20px 40px; text-align:center; box-shadow:0 0 40px var(--glow); }
    .question-label { font-size:11px; font-weight:700; letter-spacing:0.2em; text-transform:uppercase; color:var(--gold); margin-bottom:8px; opacity:0.8; }
    .question-text { font-size:clamp(18px,2.2vw,26px); font-weight:600; line-height:1.5; color:var(--text); max-width:900px; margin:0 auto; }

    /* AI Summary Bar */
    .ai-summary-bar { display:none; background:linear-gradient(135deg,rgba(124,106,247,0.12),rgba(168,85,247,0.08)); border-bottom:1px solid rgba(124,106,247,0.25); padding:16px 40px; }
    .ai-summary-bar.visible { display:block; animation:fadeIn 0.5s ease; }
    @keyframes fadeIn { from{opacity:0;transform:translateY(-8px)} to{opacity:1;transform:translateY(0)} }
    .ai-summary-inner { max-width:1200px; margin:0 auto; }
    .ai-summary-title { font-size:11px; font-weight:700; letter-spacing:0.15em; text-transform:uppercase; color:#a855f7; margin-bottom:10px; display:flex; align-items:center; gap:6px; }
    .ai-themes-row { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:8px; }
    .ai-theme-chip { background:rgba(124,106,247,0.15); border:1px solid rgba(124,106,247,0.3); color:var(--text); font-size:13px; padding:5px 14px; border-radius:20px; }
    .ai-dominant { font-size:14px; color:var(--muted); margin-bottom:6px; }
    .ai-dominant strong { color:var(--text); }
    .ai-quote { font-size:13px; font-style:italic; color:var(--gold); border-right:3px solid var(--gold); padding-right:10px; }

    /* Word Cloud */
    .wordcloud-bar { display:none; background:var(--surface); border-bottom:1px solid var(--border); padding:12px 40px; }
    .wordcloud-bar.visible { display:block; }
    .wordcloud-inner { max-width:1200px; margin:0 auto; display:flex; flex-wrap:wrap; gap:8px; align-items:center; justify-content:center; }
    .wc-word { font-weight:700; color:var(--text); opacity:0.85; transition:opacity 0.2s; cursor:default; }
    .wc-word:hover { opacity:1; }

    .cards-area { overflow-y:auto; padding:24px 40px; display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:16px; align-content:start; direction:ltr; }
    .empty-state { grid-column:1/-1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; padding:80px 20px; color:var(--muted); text-align:center; direction:rtl; }
    .empty-icon { font-size:56px; opacity:0.25; }
    .empty-text { font-size:20px; font-weight:500; }
    .empty-sub { font-size:14px; opacity:0.55; }
    .answer-card { background:var(--card); border:1px solid var(--border); border-radius:20px; padding:24px 26px; display:flex; flex-direction:column; gap:12px; text-align:center; direction:rtl; animation:slideIn 0.4s cubic-bezier(0.22,1,0.36,1); transition:border-color 0.2s,background 0.2s; }
    .answer-card:hover { border-color:rgba(255,255,255,0.14); background:var(--card2); }
    @keyframes slideIn { from{opacity:0;transform:translateY(18px) scale(0.97)} to{opacity:1;transform:translateY(0) scale(1)} }
    .answer-card.new-flash { border-color:var(--gold); box-shadow:0 0 24px var(--glow); animation:slideIn 0.4s cubic-bezier(0.22,1,0.36,1),flashBorder 1.8s ease 0.4s forwards; }
    @keyframes flashBorder { from{border-color:var(--gold);box-shadow:0 0 24px var(--glow)} to{border-color:var(--border);box-shadow:none} }
    .answer-number { font-size:11px; font-weight:700; letter-spacing:0.15em; color:var(--accent); text-transform:uppercase; }
    .answer-text { font-size:clamp(16px,1.8vw,24px); font-weight:500; line-height:1.65; color:var(--text); text-align:center; }
    .answer-time { font-size:12px; color:var(--muted); opacity:0.45; direction:ltr; }
    .cards-area::-webkit-scrollbar { width:6px; }
    .cards-area::-webkit-scrollbar-track { background:transparent; }
    .cards-area::-webkit-scrollbar-thumb { background:rgba(255,255,255,0.1); border-radius:3px; }
  </style>
</head>
<body>
<div class="header">
  <div class="header-title">קיר הדילמות הניהוליות</div>
  <div class="count-badge">תשובות: <span id="countNum">0</span></div>
  <div class="live-badge"><span class="live-dot"></span>זמן אמת</div>
</div>
<div class="question-bar">
  <div class="question-label">הדילמה שלנו היום</div>
  <div class="question-text" id="questionText">טוען שאלה…</div>
</div>

<!-- AI Summary Bar -->
<div class="ai-summary-bar" id="aiSummaryBar">
  <div class="ai-summary-inner">
    <div class="ai-summary-title">✨ סיכום AI — תמות מרכזיות</div>
    <div class="ai-themes-row" id="aiThemes"></div>
    <div class="ai-dominant" id="aiDominant"></div>
    <div class="ai-quote" id="aiQuote"></div>
  </div>
</div>

<!-- Word Cloud Bar -->
<div class="wordcloud-bar" id="wordcloudBar">
  <div class="wordcloud-inner" id="wordcloudInner"></div>
</div>

<div class="cards-area" id="cardsArea">
  <div class="empty-state" id="emptyState">
    <div class="empty-icon">💬</div>
    <div class="empty-text">ממתין לתשובות…</div>
    <div class="empty-sub">המשתתפים יכולים לשלוח תשובות עכשיו</div>
  </div>
</div>

<script>
  let answers=[], knownIds=new Set();

  async function loadQuestion(){
    try{ const d=await(await fetch('/api/question')).json(); document.getElementById('questionText').textContent=d.question; }catch{}
  }

  async function fetchAnswers(){
    try{
      const data=await(await fetch('/api/answers')).json();
      const newOnes=data.filter(a=>!knownIds.has(a.id));
      if(newOnes.length>0){ newOnes.forEach(a=>knownIds.add(a.id)); answers=data; renderCards(newOnes.map(a=>a.id)); updateWordCloud(); }
    }catch{}
  }

  async function fetchSummary(){
    try{
      const d=await(await fetch('/api/summary')).json();
      if(d && d.themes && d.themes.length>0){
        const bar=document.getElementById('aiSummaryBar');
        document.getElementById('aiThemes').innerHTML = d.themes.map(t=>`<span class="ai-theme-chip">💡 ${escapeHTML(t)}</span>`).join('');
        document.getElementById('aiDominant').innerHTML = `<strong>כיוון דומיננטי:</strong> ${escapeHTML(d.dominant)}`;
        document.getElementById('aiQuote').textContent = `"${d.quote}"`;
        bar.classList.add('visible');
      }
    }catch{}
  }

  function updateWordCloud(){
    if(!answers.length) return;
    const stopWords = new Set(['את','של','אני','הוא','היא','אנחנו','הם','זה','זו','כי','אם','עם','על','בין','אבל','לא','כן','יש','אין','רק','גם','כל','כדי','אחד','מה','לך','לי','לו','לה','להם','שלי','שלך','שלו','שלה','כאשר','אחרי','לפני','עוד','היה','היתה','הייתי','מאוד','כך','אז','שם','כאן','איך','מי','מתי','למה','אבל','אך','עד','מן','את','אל','בו','בה','בהם','ב','ל','מ','ו','ה','שה']);
    const freq = {};
    answers.forEach(a=>{
      a.text.split(/\s+/).forEach(w=>{
        const clean = w.replace(/[^\u05D0-\u05FAa-zA-Z]/g,'');
        if(clean.length>2 && !stopWords.has(clean)){
          freq[clean]=(freq[clean]||0)+1;
        }
      });
    });
    const sorted=Object.entries(freq).sort((a,b)=>b[1]-a[1]).slice(0,25);
    if(!sorted.length) return;
    const max=sorted[0][1];
    const colors=['#f0c040','#7c6af7','#6de06d','#f07040','#40c0f0','#f040a0'];
    const inner=document.getElementById('wordcloudInner');
    inner.innerHTML=sorted.map(([w,c],i)=>{
      const size=14+Math.round((c/max)*22);
      const color=colors[i%colors.length];
      return `<span class="wc-word" style="font-size:${size}px;color:${color}">${escapeHTML(w)}</span>`;
    }).join('');
    document.getElementById('wordcloudBar').classList.add('visible');
  }

  function renderCards(flashIds=[]){
    const area=document.getElementById('cardsArea'), empty=document.getElementById('emptyState');
    area.querySelectorAll('.answer-card').forEach(c=>c.remove());
    document.getElementById('countNum').textContent=answers.length;
    if(!answers.length){ empty.style.display='flex'; return; }
    empty.style.display='none';
    [...answers].reverse().forEach((a,i)=>{
      const card=document.createElement('div');
      card.className='answer-card'+(flashIds.includes(a.id)?' new-flash':'');
      card.innerHTML=`<div class="answer-number"># ${answers.length-i}</div><div class="answer-text">${a.text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}</div><div class="answer-time">${new Date(a.timestamp).toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'})}</div>`;
      area.appendChild(card);
    });
  }

  function escapeHTML(str){return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

  loadQuestion(); fetchAnswers(); fetchSummary();
  setInterval(fetchAnswers,3000);
  setInterval(loadQuestion,10000);
  setInterval(fetchSummary,5000);
</script>
</body>
</html>
